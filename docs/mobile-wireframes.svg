<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">Bistro Eleven mobile wireframes</title>
  <desc id="desc">Five low-fidelity mobile screens: menu, sign in, checkout, account settings, and order tracking.</desc>
  <rect width="1500" height="790" fill="#f5f2ec"/>
  <text x="42" y="45" fill="#24231f" font-family="Arial, sans-serif" font-size="25" font-weight="700">BISTRO ELEVEN · MOBILE WIREFRAMES</text>
  <text x="42" y="70" fill="#77736b" font-family="Arial, sans-serif" font-size="13">Week 12 · Responsive customer journeys · Low-fidelity design</text>

